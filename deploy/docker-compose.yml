services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  web:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ../dist/pharma-frontend/browser:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "backend:host-gateway" # PharmaBackend corre en la máquina anfitriona

server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # index.html siempre se revalida: apunta a los archivos de la versión vigente
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # JS y CSS llevan hash en el nombre: se pueden guardar un año
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # El API va por el mismo origen: sin CORS
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Rutas de Angular: F5 en /productos devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

<section class="page">
  <h2>{{ esEdicion() ? 'Editar cliente' : 'Nuevo cliente' }}</h2>

  @if (error()) {
    <div class="alerta">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()" class="card formulario">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <label>
        DNI *
        <input class="input" formControlName="dni" />
        @if (form.controls.dni.touched && form.controls.dni.invalid) {
          <small class="error">El DNI es obligatorio y debe tener exactamente 8 dígitos.</small>
        }
        @if (erroresServidor()['dni']; as mensaje) {
          <small class="error">{{ mensaje }}</small>
        }
      </label>

      <label>
        Correo electrónico *
        <input class="input" type="email" formControlName="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="error">El correo es obligatorio y debe tener un formato válido.</small>
        }
        @if (erroresServidor()['email']; as mensaje) {
          <small class="error">{{ mensaje }}</small>
        }
      </label>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <label>
        Nombres *
        <input class="input" formControlName="nombres" />
        @if (form.controls.nombres.touched && form.controls.nombres.invalid) {
          <small class="error">Obligatorio (entre 2 y 100 caracteres).</small>
        }
        @if (erroresServidor()['nombres']; as mensaje) {
          <small class="error">{{ mensaje }}</small>
        }
      </label>

      <label>
        Apellidos *
        <input class="input" formControlName="apellidos" />
        @if (form.controls.apellidos.touched && form.controls.apellidos.invalid) {
          <small class="error">Obligatorio (entre 2 y 100 caracteres).</small>
        }
        @if (erroresServidor()['apellidos']; as mensaje) {
          <small class="error">{{ mensaje }}</small>
        }
      </label>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <label>
        Teléfono
        <input class="input" formControlName="telefono" />
        @if (form.controls.telefono.touched && form.controls.telefono.invalid) {
          <small class="error">Debe tener exactamente 9 dígitos si se ingresa.</small>
        }
        @if (erroresServidor()['telefono']; as mensaje) {
          <small class="error">{{ mensaje }}</small>
        }
      </label>

      <label>
        Dirección
        <input class="input" formControlName="direccion" />
        @if (form.controls.direccion.touched && form.controls.direccion.invalid) {
          <small class="error">Máximo 250 caracteres.</small>
        }
        @if (erroresServidor()['direccion']; as mensaje) {
          <small class="error">{{ mensaje }}</small>
        }
      </label>
    </div>

    <label class="check">
      <input type="checkbox" formControlName="estado" /> Activo
    </label>

    <div class="acciones">
      <a routerLink="/clientes" class="btn">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="guardando()">
        {{ guardando() ? 'Guardando…' : (esEdicion() ? 'Actualizar' : 'Registrar') }}
      </button>
    </div>
  </form>
</section>

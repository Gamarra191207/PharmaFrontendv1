<section class="card">
  <h3>Productos más vendidos</h3>
  <table class="tabla">
    <thead>
      <tr>
        <th>Producto</th><th>Categoría</th><th>Cantidad</th><th>Monto</th>
      </tr>
    </thead>
    <tbody>
      @for (f of filas(); track f.productoId) {
        <tr>
          <td>{{ f.productoNombre }}</td>
          <td>{{ f.categoriaNombre }}</td>
          <td>{{ f.cantidadVendida }}</td>
          <td>{{ f.montoTotal | currency: 'PEN' : 'S/ ' }}</td>
        </tr>
      } @empty {
        <tr><td colspan="4">Aún no hay ventas registradas.</td></tr>
      }
    </tbody>
  </table>
</section>
